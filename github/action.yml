name: "Bonk GitHub Action"
description: "Run Bonk (OpenCode) in GitHub Actions workflows"
branding:
  icon: "git-pull-request"
  color: "orange"

inputs:
  model:
    description: "Model to use (e.g., opencode/claude-opus-4-5)"
    required: true

  agent:
    description: "Set the agent to use for this workflow. Falls back to the default_agent if set in config, else 'build'"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  mentions:
    description: "Comma-separated trigger phrases (e.g., '/bonk,@ask-bonk')"
    required: false
    default: "/bonk,@ask-bonk"

  permissions:
    description: "Required permission level: 'admin', 'write', 'any', or 'CODEOWNERS' (checks .github/CODEOWNERS)"
    required: false
    default: "write"

  oidc_base_url:
    description: "Base URL for OIDC token exchange"
    required: false
    default: "https://ask-bonk.silverlock.workers.dev/auth"

  forks:
    description: "Post a 'not supported' comment on fork PRs. Set to 'false' to silently skip fork PRs."
    required: false
    default: "true"

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  token_permissions:
    description: "Scope the installation token: 'NO_PUSH' (can comment but not push), 'WRITE' (default), or a JSON permissions object"
    required: false

  opencode_version:
    description: "OpenCode version supported by this immutable action runtime"
    required: false
    default: "1.18.31"

  opencode_dev:
    description: "Compatibility input; 'true' is refused by the immutable action runtime"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Check mentions
      id: mentions
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        REVIEW_BODY: ${{ github.event.review.body }}
        MENTIONS: ${{ inputs.mentions }}
      run: |
        BODY=""

        case "$EVENT_NAME" in
          issue_comment|pull_request_review_comment)
            BODY="$COMMENT_BODY"
            ;;
          pull_request_review)
            BODY="$REVIEW_BODY"
            ;;
          issues|pull_request|workflow_dispatch|schedule)
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
            ;;
          *)
            echo "Unsupported event type: $EVENT_NAME"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
            ;;
        esac

        IFS=',' read -ra MENTION_ARRAY <<< "$MENTIONS"

        for mention in "${MENTION_ARRAY[@]}"; do
          mention="${mention#"${mention%%[![:space:]]*}"}"
          mention="${mention%"${mention##*[![:space:]]}"}"
          if [[ "$BODY" == *"$mention"* ]]; then
            echo "Found mention: $mention"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
        done

        echo "No matching mention found in comment"
        echo "skip=true" >> $GITHUB_OUTPUT

    - name: Setup bun
      if: success() && steps.mentions.outputs.skip != 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: "1.3.14"

    - name: Pre-flight orchestration
      if: success() && steps.mentions.outputs.skip != 'true'
      id: preflight
      shell: bash
      env:
        # permissions
        REQUIRED_PERMISSION: ${{ inputs.permissions }}
        COMMENT_ACTOR: ${{ github.event.comment.user.login }}
        REVIEW_ACTOR: ${{ github.event.review.user.login }}
        # setup + track
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EVENT_NAME: ${{ github.event_name }}
        # version
        GH_TOKEN: ${{ github.token }}
        OPENCODE_VERSION: ${{ inputs.opencode_version }}
        OPENCODE_DEV: ${{ inputs.opencode_dev }}
        # prompt
        PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.issue.pull_request.url && github.event.issue.number || github.event.pull_request.number || '' }}
        PR_URL: ${{ github.event.pull_request.url || github.event.issue.pull_request.url || '' }}
        USER_PROMPT: ${{ inputs.prompt }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        REVIEW_BODY: ${{ github.event.review.body }}
        MENTIONS: ${{ inputs.mentions }}
        ACTION_PATH: ${{ github.action_path }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # fork-comment
        FORKS: ${{ inputs.forks }}
        ACTOR: ${{ github.event.comment.user.login || github.event.review.user.login || github.actor }}
        # track
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        COMMENT_ID: ${{ github.event.comment.id }}
        COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        ISSUE_CREATED_AT: ${{ github.event.issue.created_at || github.event.pull_request.created_at }}
        # token scoping
        TOKEN_PERMISSIONS: ${{ inputs.token_permissions }}
      run: bun run ${{ github.action_path }}/script/orchestrate.ts

    - name: Install opencode
      if: success() && steps.mentions.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
      shell: bash
      env:
        OPENCODE_DEV: ${{ steps.preflight.outputs.dev }}
        OPENCODE_VERSION: ${{ steps.preflight.outputs.opencode_version }}
      run: |
        set -euo pipefail
        if [ "$OPENCODE_DEV" = "true" ] || [ "$OPENCODE_VERSION" != "1.18.31" ]; then
          echo "Unsupported OpenCode runtime request: use the action-pinned version 1.18.31" >&2
          exit 1
        fi
        bun install --cwd "${GITHUB_ACTION_PATH}/runtime" --frozen-lockfile --production
        echo "${GITHUB_ACTION_PATH}/runtime/node_modules/.bin" >> "${GITHUB_PATH}"
        "${GITHUB_ACTION_PATH}/runtime/node_modules/.bin/opencode" --version

    - name: Configure Git
      if: success() && steps.mentions.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
      id: configure_git
      shell: bash
      env:
        TOKEN_PERMISSIONS: ${{ inputs.token_permissions }}
      run: |
        set -euo pipefail
        git config --global user.name "ask-bonk[bot]"
        git config --global user.email "ask-bonk[bot]@users.noreply.github.com"
        server_url="${GITHUB_SERVER_URL:-https://github.com}"
        host="${server_url#https://}"
        host="${host#http://}"
        git config --unset-all "http.${server_url}/.extraheader" 2>/dev/null || true

        # NO_PUSH still needs GH_TOKEN for review comments, but it must not leave
        # that short-lived App token in .git/config where tools can read it.
        normalized_permissions="${TOKEN_PERMISSIONS}"
        normalized_permissions="${normalized_permissions#"${normalized_permissions%%[![:space:]]*}"}"
        normalized_permissions="${normalized_permissions%"${normalized_permissions##*[![:space:]]}"}"
        normalized_permissions="$(printf '%s' "${normalized_permissions}" | tr '[:lower:]' '[:upper:]')"
        if [ "${normalized_permissions}" = "NO_PUSH" ]; then
          git remote set-url origin "${server_url}/${GITHUB_REPOSITORY}.git"
          echo "read_only=true" >> "${GITHUB_OUTPUT}"
        elif [ -n "${GH_TOKEN:-}" ]; then
          # Write-capable runs use the App token so pushes trigger downstream
          # workflows; actions/checkout's GITHUB_TOKEN does not do so.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.git"
        fi

    - name: Run opencode
      if: |
        success() && steps.mentions.outputs.skip != 'true' && steps.preflight.outputs.skip != 'true'
        && (steps.preflight.outputs.is_fork != 'true' || steps.preflight.outputs.run_opencode == 'true')
      id: opencode
      shell: bash
      run: |
        set +e
        if [ "${READ_ONLY_GIT}" = "true" ]; then
          # Scope read authentication to this step. Reset any inherited
          # credential helpers, require the exact repository path and use a
          # trusted helper that refuses every other protocol/host/repository.
          export GIT_CONFIG_COUNT=4
          export GIT_CONFIG_KEY_0="credential.helper"
          export GIT_CONFIG_VALUE_0=""
          export GIT_CONFIG_KEY_1="credential.useHttpPath"
          export GIT_CONFIG_VALUE_1="true"
          export GIT_CONFIG_KEY_2="core.askPass"
          export GIT_CONFIG_VALUE_2="/bin/false"
          export GIT_CONFIG_KEY_3="credential.helper"
          export GIT_CONFIG_VALUE_3="!${GITHUB_ACTION_PATH}/script/git-credential-readonly.ts"
          export GIT_ASKPASS=/bin/false
          export SSH_ASKPASS=/bin/false
          export GIT_TERMINAL_PROMPT=0
        fi
        # GH_TOKEN is the App token written to GITHUB_ENV by the OIDC exchange step.
        export USE_GITHUB_TOKEN=true
        export GITHUB_TOKEN="${GH_TOKEN}"
        timeout 45m opencode github run
        EXIT_CODE=$?
        echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
        exit $EXIT_CODE
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        VARIANT: ${{ inputs.variant }}
        PROMPT: ${{ steps.preflight.outputs.value }}
        SHARE: false
        MENTIONS: ${{ inputs.mentions }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        READ_ONLY_GIT: ${{ steps.configure_git.outputs.read_only }}
        # Expose the PR/issue number so OpenCode (and any shell commands the
        # model runs, e.g. `gh api .../pulls/$PR_NUMBER/reviews`) can
        # reference the correct PR without having to infer it from git or
        # the GitHub API. This prevents the model from accidentally
        # discovering and acting on a different PR.
        PR_NUMBER: ${{ github.event.issue.pull_request.url && github.event.issue.number || github.event.pull_request.number || '' }}
        ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || '' }}

    - name: Finalize Bonk run
      if: |
        always() && steps.preflight.outcome == 'success' && steps.mentions.outputs.skip != 'true'
        && steps.preflight.outputs.skip != 'true'
        && (steps.preflight.outputs.is_fork != 'true' || steps.preflight.outputs.run_opencode == 'true')
      shell: bash
      env:
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        OPENCODE_STATUS: ${{ steps.opencode.outcome }}
        # Pass issue/PR context so the server can post failure comments even
        # when the run was never tracked or was already removed from activeRuns.
        ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
      run: bun run ${{ github.action_path }}/script/finalize.ts
